<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Signal from Noise</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #07070a;
    --bg-1: #0d0e12;
    --ink: #efece4;
    --ink-dim: #8b8a85;
    --alert: #b48cf2;
    --alert-dim: #7a5cc4;
    --info: #7aa9ff;
    --gold: #c8b8ff;
    --warm-1: #0f0e1a;
    --warm-2: #6e7df2;
    --warm-3: #c9c2ff;
    --warm-4: #e6e0ff;
    --lens: 520px;
    --phone-w: 320px;
    --phone-h: 580px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 90% 60% at 50% 50%, #14132a 0%, #07071a 70%, #04040c 100%);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Subtle film grain */
  .stage::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 30;
  }

  /* Vignette */
  .stage::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 25;
  }

  /* ---------- NOISE FIELD ---------- */
  .noise-field {
    position: absolute; inset: 0;
    z-index: 5;
  }

  .frag {
    position: absolute;
    transform-origin: center;
    will-change: transform, opacity;
    user-select: none;
    pointer-events: none;
    animation-iteration-count: infinite;
    animation-timing-function: cubic-bezier(0.5, 0.05, 0.5, 0.95);
  }

  /* Fragment styles ------------------------------------------------ */

  .card {
    background: rgba(20,20,24,0.85);
    backdrop-filter: blur(2px);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--ink);
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    font-size: 13px;
    max-width: 260px;
    line-height: 1.35;
  }

  .card .meta {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-dim);
    font-size: 11px;
    font-family: "IBM Plex Mono", monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .card .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--info);
  }

  .card.alert {
    border-color: rgba(180,140,242,0.4);
    background: rgba(22,16,42,0.92);
  }
  .card.alert .meta { color: var(--alert); }
  .card.alert .dot { background: var(--alert); animation: blink 1s infinite; }

  .headline {
    font-family: "IBM Plex Serif", serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.2;
    color: var(--ink);
    max-width: 320px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
  }
  .headline .kicker {
    display: block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--alert);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 5px 12px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 500;
    backdrop-filter: blur(2px);
  }
  .pill.mono { font-family: "IBM Plex Mono", monospace; letter-spacing: 0.04em; }
  .pill.live {
    border-color: rgba(180,140,242,0.5);
    background: rgba(22,16,42,0.7);
    color: var(--alert);
  }
  .pill.live::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--alert);
    animation: blink 1s infinite;
  }
  .pill.up { color: #6fd49a; border-color: rgba(111,212,154,0.25); }
  .pill.down { color: var(--alert); border-color: rgba(226,72,60,0.3); }

  .badge {
    background: var(--alert);
    color: white;
    font-family: "IBM Plex Mono", monospace;
    font-weight: 600;
    font-size: 12px;
    border-radius: 999px;
    padding: 3px 9px;
    box-shadow: 0 0 0 2px rgba(180,140,242,0.25), 0 6px 18px rgba(140,120,255,0.5);
    letter-spacing: 0.04em;
  }

  .stars {
    font-family: "IBM Plex Mono", monospace;
    color: var(--gold);
    font-size: 16px;
    text-shadow: 0 0 10px rgba(200,184,255,0.4);
    letter-spacing: 2px;
  }
  .stars .off { color: rgba(200,184,255,0.2); }

  .ticker {
    display: inline-flex;
    gap: 10px;
    align-items: baseline;
    font-family: "IBM Plex Mono", monospace;
    background: rgba(15,16,20,0.85);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 12px;
  }
  .ticker .sym { color: var(--ink); font-weight: 600; }
  .ticker .val { color: var(--ink-dim); }

  .quote {
    font-family: "IBM Plex Serif", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--ink-dim);
    max-width: 240px;
    line-height: 1.4;
  }
  .quote::before { content: "“"; color: var(--ink); margin-right: 2px; }
  .quote::after  { content: "”"; color: var(--ink); margin-left: 2px; }

  .hashtag {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 700;
    color: var(--info);
    font-size: 14px;
  }

  .reaction {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(20,20,24,0.85);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 999px;
    padding: 4px 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
  }
  .reaction .icon {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.6;
  }
  .reaction .icon.heart { background: var(--alert); }
  .reaction .icon.eye { background: var(--info); }

  /* ---------- DRIFT ANIMATIONS ---------- */
  /* Fragments stream from outer edges toward the lens (center),
     fading and scaling as they "get filtered." */

  @keyframes drift-l { /* from left, sweep right and curve into lens */
    0%   { transform: translate(-30vw, 0) rotate(-3deg) scale(1);   opacity: 0; }
    8%   { opacity: 1; }
    55%  { transform: translate(20vw, -2vh) rotate(1deg) scale(0.95); opacity: 1; }
    78%  { transform: translate(36vw, 0) rotate(2deg) scale(0.5); opacity: 0.7; filter: blur(2px); }
    92%  { transform: translate(40vw, 0) rotate(2deg) scale(0.2); opacity: 0; filter: blur(6px); }
    100% { transform: translate(40vw, 0) rotate(2deg) scale(0.2); opacity: 0; }
  }
  @keyframes drift-r {
    0%   { transform: translate(30vw, 0) rotate(3deg) scale(1);   opacity: 0; }
    8%   { opacity: 1; }
    55%  { transform: translate(-20vw, 2vh) rotate(-1deg) scale(0.95); opacity: 1; }
    78%  { transform: translate(-36vw, 0) rotate(-2deg) scale(0.5); opacity: 0.7; filter: blur(2px); }
    92%  { transform: translate(-40vw, 0) rotate(-2deg) scale(0.2); opacity: 0; filter: blur(6px); }
    100% { transform: translate(-40vw, 0) rotate(-2deg) scale(0.2); opacity: 0; }
  }
  @keyframes drift-t {
    0%   { transform: translate(0, -28vh) rotate(0deg) scale(1);   opacity: 0; }
    10%  { opacity: 1; }
    60%  { transform: translate(2vw, 18vh) rotate(2deg) scale(0.9); opacity: 1; }
    82%  { transform: translate(0, 30vh) rotate(0deg) scale(0.4); opacity: 0.6; filter: blur(3px); }
    100% { transform: translate(0, 30vh) rotate(0deg) scale(0.2); opacity: 0; }
  }
  @keyframes drift-b {
    0%   { transform: translate(0, 28vh) rotate(0deg) scale(1);   opacity: 0; }
    10%  { opacity: 1; }
    60%  { transform: translate(-2vw, -18vh) rotate(-2deg) scale(0.9); opacity: 1; }
    82%  { transform: translate(0, -30vh) rotate(0deg) scale(0.4); opacity: 0.6; filter: blur(3px); }
    100% { transform: translate(0, -30vh) rotate(0deg) scale(0.2); opacity: 0; }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  @keyframes blink {
    0%, 60%, 100% { opacity: 1; }
    70%, 90%      { opacity: 0.25; }
  }

  /* ---------- PHONE ---------- */
  .lens-wrap {
    position: absolute;
    left: 50%; top: 50%;
    width: var(--phone-w); height: var(--phone-h);
    transform: translate(-50%, -50%);
    z-index: 20;
  }

  .lens-glow {
    position: absolute; inset: -120px;
    border-radius: 80px;
    background: radial-gradient(ellipse at center, rgba(140,120,255,0.34) 0%, rgba(110,125,242,0.10) 45%, transparent 70%);
    filter: blur(30px);
    animation: glow-pulse 6s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }

  .phone {
    position: absolute; inset: 0;
    border-radius: 52px;
    background: linear-gradient(160deg, #1f1c2e 0%, #0c0a18 60%, #050410 100%);
    box-shadow:
      inset 0 0 0 1.5px rgba(180,160,255,0.14),
      inset 0 2px 0 rgba(255,255,255,0.05),
      0 30px 80px rgba(0,0,0,0.75);
    padding: 10px;
    overflow: hidden;
  }
  .screen {
    position: absolute; inset: 10px;
    border-radius: 42px;
    background:
      radial-gradient(ellipse 100% 70% at 50% 0%, #3a2870 0%, #1a1238 55%, #0a0820 100%);
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(180,140,242,0.18), inset 0 0 60px rgba(0,0,0,0.4);
  }
  .notch {
    position: absolute; left: 50%; top: 12px;
    transform: translateX(-50%);
    width: 96px; height: 28px;
    border-radius: 14px;
    background: #000;
    z-index: 12;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .notch::after {
    content: "";
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #1a1238;
    box-shadow: inset 0 0 0 1px rgba(180,140,242,0.5);
  }
  .status {
    position: absolute; left: 0; right: 0; top: 16px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 24px;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 13px;
    color: #fff;
    font-weight: 600;
    z-index: 11;
  }
  .status .right {
    display: inline-flex; gap: 5px; align-items: center;
  }
  .status .right .signal,
  .status .right .wifi,
  .status .right .batt {
    width: 14px; height: 10px;
    background: #fff;
    border-radius: 1.5px;
    opacity: 0.9;
  }
  .status .right .signal {
    clip-path: polygon(0 100%, 18% 100%, 18% 70%, 0 70%, 0 100%, 28% 100%, 38% 100%, 38% 50%, 28% 50%, 28% 100%, 48% 100%, 58% 100%, 58% 30%, 48% 30%, 48% 100%, 68% 100%, 78% 100%, 78% 10%, 68% 10%, 68% 100%);
  }
  .status .right .wifi {
    clip-path: polygon(0 90%, 50% 30%, 100% 90%, 85% 90%, 50% 55%, 15% 90%);
    height: 9px;
  }
  .status .right .batt {
    width: 22px; height: 11px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 3px;
    position: relative;
  }
  .status .right .batt::before {
    content: "";
    position: absolute; left: 1px; top: 1px; bottom: 1px;
    width: 75%;
    background: #fff;
    border-radius: 1.5px;
  }
  .status .right .batt::after {
    content: "";
    position: absolute; right: -3px; top: 3px;
    width: 2px; height: 4px;
    background: rgba(255,255,255,0.85);
    border-radius: 0 1px 1px 0;
  }

  .lock-time {
    position: absolute; left: 0; right: 0; top: 64px;
    text-align: center;
    pointer-events: none;
    z-index: 5;
  }
  .lock-date {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.02em;
    margin-bottom: 2px;
  }
  .lock-hh {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 76px;
    font-weight: 200;
    color: #fff;
    line-height: 1;
    letter-spacing: -0.04em;
    text-shadow: 0 2px 30px rgba(0,0,0,0.4);
  }

  .notifs {
    position: absolute;
    left: 12px; right: 12px;
    bottom: 30px;
    top: 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: flex-end;
    z-index: 6;
    overflow: hidden;
  }
  .notif {
    background: rgba(40,30,80,0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(180,160,255,0.16);
    border-radius: 14px;
    padding: 9px 11px 10px;
    display: grid;
    grid-template-columns: 26px 1fr auto;
    grid-template-rows: auto auto;
    column-gap: 9px;
    row-gap: 2px;
    align-items: center;
    color: #efece4;
    opacity: 0;
    transform: translateY(28px) scale(0.94);
    transition: opacity 0.55s cubic-bezier(0.2,0.8,0.2,1), transform 0.55s cubic-bezier(0.2,0.8,0.2,1), max-height 0.4s ease, margin 0.4s ease;
    box-shadow: 0 4px 24px rgba(0,0,0,0.32);
    max-height: 80px;
  }
  .notif.shown { opacity: 1; transform: translateY(0) scale(1); }
  .notif .icon {
    grid-row: 1 / span 2;
    width: 26px; height: 26px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), 0 2px 6px rgba(0,0,0,0.25);
  }
  .notif .app {
    grid-column: 2; grid-row: 1;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: rgba(239,236,228,0.7);
    font-family: "IBM Plex Mono", monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notif .when {
    grid-column: 3; grid-row: 1;
    font-size: 10px;
    color: rgba(239,236,228,0.55);
    font-family: "IBM Plex Mono", monospace;
  }
  .notif .title {
    grid-column: 2 / span 2; grid-row: 2;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    line-height: 1.25;
  }
  .notif.cal   .icon { background: linear-gradient(135deg, #b48cf2, #6e58b8); }
  .notif.rem   .icon { background: linear-gradient(135deg, #f2a3ff, #8c52d9); }
  .notif.health .icon{ background: linear-gradient(135deg, #7aa9ff, #4a6ad9); }
  .notif.alert .icon { background: linear-gradient(135deg, #ff8caa, #c44a72); }
  .notif.mail  .icon { background: linear-gradient(135deg, #b8b0ff, #5a4ec4); }
  .notif.removing { opacity: 0; transform: translateY(-8px) scale(0.96); max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: -8px; }

  .swipe {
    position: absolute; left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: 100px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.4);
    z-index: 11;
  }

  /* Particle dust streaming into lens */
  .lens-dust {
    position: absolute; inset: -120px;
    pointer-events: none;
    z-index: 19;
  }
  .dust {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(201,194,255,0.7);
    border-radius: 50%;
    animation: dust-in 4s linear infinite;
    box-shadow: 0 0 4px rgba(178,158,255,0.7);
  }
  @keyframes dust-in {
    0%   { transform: translate(var(--sx), var(--sy)) scale(1); opacity: 0; }
    20%  { opacity: 0.9; }
    90%  { transform: translate(0, 0) scale(0.4); opacity: 0.7; }
    100% { transform: translate(0, 0) scale(0); opacity: 0; }
  }

  /* ---------- EDITORIAL CHROME ---------- */
  .topbar, .botbar {
    position: absolute;
    left: 0; right: 0;
    z-index: 28;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 40px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .topbar { top: 0; }
  .botbar { bottom: 0; }

  .topbar .brand {
    color: var(--ink);
    font-family: "IBM Plex Serif", serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: none;
    font-style: italic;
  }
  .topbar .brand span {
    color: var(--alert);
    font-style: normal;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    margin-right: 10px;
    vertical-align: 1px;
    text-transform: uppercase;
  }

  .crosshair {
    display: flex; gap: 8px; align-items: center;
  }
  .crosshair .pip { width: 5px; height: 5px; background: var(--ink-dim); border-radius: 50%; }
  .crosshair .pip.on { background: var(--alert); animation: blink 1s infinite; }


  /* Side legend */
  .legend {
    position: absolute;
    z-index: 28;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    line-height: 1.7;
  }
  .legend.left { left: 40px; top: 50%; transform: translateY(-50%); text-align: left; }
  .legend.right { right: 40px; top: 50%; transform: translateY(-50%); text-align: right; }
  .legend .num {
    color: var(--ink);
    font-weight: 600;
    display: block;
    font-size: 22px;
    font-family: "IBM Plex Serif", serif;
    letter-spacing: 0;
    margin-top: 4px;
  }
  .legend .num.warm { color: var(--warm-3); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-height: 680px) {
    :root { --phone-w: 280px; --phone-h: 520px; }
  }
  @media (max-width: 900px) {
    :root { --phone-w: 260px; --phone-h: 500px; }
    .legend { display: none; }
    .topbar, .botbar { padding: 18px 20px; }
  }
  @media (max-width: 560px) {
    :root { --phone-w: 220px; --phone-h: 440px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .frag { animation: none !important; }
    .dust { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">


    <!-- Noise field (populated by JS) -->
    <div class="noise-field" id="noise"></div>

    <!-- Particle dust streaming into lens -->
    <div class="lens-dust" id="dust"></div>

    <!-- Central phone -->
    <div class="lens-wrap">
      <div class="lens-glow"></div>
      <div class="phone">
        <div class="screen">
          <div class="notch"></div>
          <div class="status">
            <span>9:41</span>
            <span class="right">
              <span class="signal"></span>
              <span class="wifi"></span>
              <span class="batt"></span>
            </span>
          </div>
          <div class="lock-time">
            <div class="lock-date">Tuesday, May 12</div>
            <div class="lock-hh">9:41</div>
          </div>
          <div class="notifs" id="notifs"></div>
          <div class="swipe"></div>
        </div>
      </div>
    </div>

  </div>

<script>
/* =====================================================================
   NOISE FIELD GENERATOR
   Populates the area around the lens with drifting media fragments.
   ===================================================================== */

const NOISE = document.getElementById('noise');
const DUST = document.getElementById('dust');

const HEADLINES = [
  { kicker: "BREAKING", text: "Markets reel as policy shock ripples through sectors" },
  { kicker: "OPINION",  text: "The end of attention as we knew it" },
  { kicker: "ANALYSIS", text: "Why the index keeps lying to us" },
  { kicker: "EXCLUSIVE",text: "Inside the room where the deal collapsed" },
  { kicker: "TRENDING", text: "What everyone got wrong about Tuesday" },
  { kicker: "ALERT",    text: "Outage spreads to second region overnight" }
];

const POSTS = [
  { meta: "@journalist · 2m", text: "Sources confirm the meeting did not happen." },
  { meta: "@analyst · 14s",   text: "This take is not aging well." },
  { meta: "@desk · 4m",       text: "We're tracking three independent reports." },
  { meta: "@feed · 38s",      text: "Replying to thread of 412 with hot takes." },
  { meta: "@bot_acct · 1m",   text: "Engagement up 1,240% on this clip." }
];

const QUOTES = [
  "this changes everything",
  "huge if true — wait for it",
  "everyone is missing the real story",
  "you won't believe what happens next",
  "we tried to warn you in 2019"
];

const HASHTAGS = ["#breaking", "#thread", "#urgent", "#exclusive", "#hottake", "#viral", "#opinion", "#alert"];

const TICKERS = [
  { sym: "IDX", val: "▲ 4.21%", dir: "up" },
  { sym: "VOL", val: "▼ 2.04%", dir: "down" },
  { sym: "FX",  val: "▲ 0.18%", dir: "up" },
  { sym: "BND", val: "▼ 1.32%", dir: "down" },
  { sym: "OIL", val: "▲ 3.77%", dir: "up" }
];

const STARS = [
  ["★","★","★","★","★"],
  ["★","★","★","★","☆"],
  ["★","★","★","☆","☆"],
  ["★","★","★","★","☆"]
];

/* Place fragments. We avoid the central lens area and have them animate
   from outside the screen toward the lens. Uses CSS keyframe drifts. */

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

const LANES = [
  // top band
  { dir: 't', topPct: () => rand(8, 22),  leftPct: () => rand(8, 92),  anim: 'drift-b' },
  // bottom band
  { dir: 'b', topPct: () => rand(78, 92), leftPct: () => rand(8, 92),  anim: 'drift-t' },
  // left band
  { dir: 'l', topPct: () => rand(20, 80), leftPct: () => rand(4, 22),  anim: 'drift-l' },
  // right band
  { dir: 'r', topPct: () => rand(20, 80), leftPct: () => rand(78, 96), anim: 'drift-r' }
];

function spawn(html, opts = {}) {
  const lane = opts.lane || pick(LANES);
  const el = document.createElement('div');
  el.className = 'frag ' + (opts.cls || '');
  el.innerHTML = html;
  el.style.top = lane.topPct() + '%';
  el.style.left = lane.leftPct() + '%';
  const dur = opts.dur || rand(11, 18);
  const delay = opts.delay !== undefined ? opts.delay : rand(-dur, 0);
  el.style.animation = `${lane.anim} ${dur}s linear ${delay}s infinite`;
  // a subtle floating layer
  el.style.opacity = '0';
  NOISE.appendChild(el);
  return el;
}

/* Layered population: many small + fewer large */

function buildHeadline() {
  const h = pick(HEADLINES);
  return `<div class="headline"><span class="kicker">${h.kicker}</span>${h.text}</div>`;
}
function buildCard() {
  const p = pick(POSTS);
  const alert = Math.random() < 0.18;
  return `<div class="card${alert ? ' alert' : ''}">
    <div class="meta"><span class="dot"></span>${alert ? "PUSH ALERT" : p.meta}</div>
    <div>${alert ? "Multiple outlets reporting unconfirmed claims." : p.text}</div>
  </div>`;
}
function buildPill() {
  const types = ['live', 'mono', 'plain'];
  const t = pick(types);
  if (t === 'live') return `<span class="pill live">LIVE · ${Math.floor(rand(2,9))}.${Math.floor(rand(1,9))}M</span>`;
  if (t === 'mono') {
    const n = (rand(1.2, 9.9)).toFixed(1) + 'k';
    const labels = [`+${n} likes`, `${Math.floor(rand(120,9999))} shares`, `${Math.floor(rand(20,420))} replies`, `${(rand(1,99)).toFixed(0)}k watching`];
    return `<span class="pill mono">${pick(labels)}</span>`;
  }
  return `<span class="pill">${pick(HASHTAGS)}</span>`;
}
function buildBadge() {
  return `<span class="badge">${pick(['BREAKING','URGENT','UPDATE','LIVE','EXCLUSIVE'])}</span>`;
}
function buildStars() {
  const s = pick(STARS);
  return `<span class="stars">${s.map(c => c==='★' ? '★' : '<span class="off">★</span>').join('')}</span>`;
}
function buildTicker() {
  const t = pick(TICKERS);
  return `<span class="ticker"><span class="sym">${t.sym}</span><span class="val ${t.dir}">${t.val}</span></span>`;
}
function buildQuote() {
  return `<span class="quote">${pick(QUOTES)}</span>`;
}
function buildReaction() {
  const items = [
    `<span class="reaction"><span class="icon heart"></span>${Math.floor(rand(120,99000)).toLocaleString()}</span>`,
    `<span class="reaction"><span class="icon eye"></span>${Math.floor(rand(2,98))}.${Math.floor(rand(1,9))}M views</span>`,
    `<span class="reaction"><span class="icon"></span>${Math.floor(rand(20,4200))} comments</span>`
  ];
  return pick(items);
}
function buildHashtag() {
  return `<span class="hashtag">${pick(HASHTAGS)}</span>`;
}

const builders = [
  { fn: buildHeadline, weight: 2 },
  { fn: buildCard,     weight: 4 },
  { fn: buildPill,     weight: 4 },
  { fn: buildBadge,    weight: 1 },
  { fn: buildStars,    weight: 1 },
  { fn: buildTicker,   weight: 2 },
  { fn: buildQuote,    weight: 2 },
  { fn: buildReaction, weight: 3 },
  { fn: buildHashtag,  weight: 2 }
];
const weighted = [];
builders.forEach(b => { for (let i=0;i<b.weight;i++) weighted.push(b.fn); });

const FRAG_COUNT = window.innerWidth < 700 ? 28 : 56;
for (let i = 0; i < FRAG_COUNT; i++) {
  const fn = pick(weighted);
  spawn(fn(), { dur: rand(10, 18) });
}

/* ---------- DUST PARTICLES streaming into lens ---------- */
const DUST_COUNT = 40;
const stage = document.getElementById('stage');
function makeDust() {
  for (let i = 0; i < DUST_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'dust';
    const angle = Math.random() * Math.PI * 2;
    const dist = rand(280, 520);
    const sx = Math.cos(angle) * dist;
    const sy = Math.sin(angle) * dist;
    d.style.setProperty('--sx', sx + 'px');
    d.style.setProperty('--sy', sy + 'px');
    d.style.left = '50%';
    d.style.top = '50%';
    d.style.animationDuration = rand(3, 7) + 's';
    d.style.animationDelay = (-rand(0, 7)) + 's';
    DUST.appendChild(d);
  }
}
makeDust();

/* ---------- Phone notifications: stack-and-cycle ---------- */
const NOTIFS = [
  { app:"Calendar",  cls:"cal",    icon:"■", when:"now",    title:"Meeting about to start — Team standup" },
  { app:"Reminders", cls:"rem",    icon:"●", when:"5m ago", title:"Bookfair: purchase tickets before 6pm" },
  { app:"Calendar",  cls:"cal",    icon:"■", when:"1h",     title:"Register for design conference" },
  { app:"Health",    cls:"health", icon:"▲", when:"now",    title:"Time for a 20-min walk" },
  { app:"Reminders", cls:"rem",    icon:"●", when:"2h ago", title:"Pick up groceries on the way home" },
  { app:"Mail",      cls:"mail",   icon:"◆", when:"7m ago", title:"Pharmacy: prescription is ready" },
  { app:"Calendar",  cls:"cal",    icon:"■", when:"3h",     title:"Call with finance · quarterly review" },
  { app:"Alerts",    cls:"alert",  icon:"!", when:"now",    title:"Renew library books before midnight" }
];
(function notifLoop() {
  const root = document.getElementById('notifs');
  if (!root) return;
  const VISIBLE_MAX = 4;
  const INTERVAL = 1900;
  let idx = 0;

  function pushOne() {
    const n = NOTIFS[idx % NOTIFS.length];
    idx++;
    const el = document.createElement('div');
    el.className = 'notif ' + n.cls;
    el.innerHTML = `
      <div class="icon">${n.icon}</div>
      <div class="app">${n.app}</div>
      <div class="when">${n.when}</div>
      <div class="title">${n.title}</div>`;
    root.appendChild(el);
    setTimeout(() => el.classList.add('shown'), 30);

    while (root.children.length > VISIBLE_MAX) {
      const old = root.firstElementChild;
      old.classList.add('removing');
      setTimeout(() => old.remove(), 450);
      break;
    }
  }

  pushOne();
  setInterval(pushOne, INTERVAL);
})();


</script>
</body>
